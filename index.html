<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversor EGP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conversor EGP">
<meta name="theme-color" content="#b8862b">
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a65;
    --line:#e3dfd5; --accent:#b8862b; --ok:#2f7d4f; --warn:#b4532a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#15140f; --card:#1f1d17; --ink:#f1ede3; --muted:#a39f93;
      --line:#34312a; --accent:#d9a648; --ok:#5cb37f; --warn:#e07b4f; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center;padding:24px 16px}
  main{width:100%;max-width:440px}
  h1{font-size:1.4rem;margin:0 0 4px}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px}
  label b{color:var(--ink);font-weight:600}
  .field{margin-bottom:16px}
  .field:last-child{margin-bottom:0}
  input{width:100%;font-size:1.5rem;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);background:transparent;color:var(--ink);font-variant-numeric:tabular-nums}
  input:focus{outline:2px solid var(--accent);border-color:transparent}
  .status{display:flex;align-items:center;gap:8px;font-size:.85rem;margin-bottom:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--ok)} .dot.off{background:var(--warn)}
  .rates{font-size:.9rem;line-height:1.7;font-variant-numeric:tabular-nums}
  .meta{font-size:.8rem;color:var(--muted);margin-top:8px}
  .warn{color:var(--warn)}
  button{margin-top:12px;width:100%;padding:11px;border-radius:10px;border:none;
    background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .badge{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;
    font-weight:600;margin-bottom:12px;border:1px solid var(--line)}
  .badge .icon{font-size:1.3rem;line-height:1}
  .badge small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;margin-top:2px}
  .badge.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:var(--ok)}
  .badge.none{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:var(--warn)}
  .badge.busy{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
  td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
  th{font-size:.75rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.03em}
  td:nth-child(3){text-align:right}
  tr:last-child td{border-bottom:none}
  .y{color:var(--ok)} .n{color:var(--warn)}
</style>
</head>
<body>
<main>
  <h1>Libra egipcia → USD / COP</h1>
  <p class="sub">Escribe en cualquier casilla y las demás se calculan.</p>

  <div class="card">
    <div class="badge" id="badge"></div>
    <table>
      <thead><tr><th>Tasa</th><th>Estado</th><th>Valor</th></tr></thead>
      <tbody id="rateTable"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="field">
      <label for="egp"><b>EGP</b><span>Libra egipcia</span></label>
      <input id="egp" inputmode="decimal" value="100">
    </div>
    <div class="field">
      <label for="usd"><b>USD</b><span>Dólar estadounidense</span></label>
      <input id="usd" inputmode="decimal">
    </div>
    <div class="field">
      <label for="cop"><b>COP</b><span>Peso colombiano</span></label>
      <input id="cop" inputmode="decimal">
    </div>
  </div>

  <div class="card">
    <div class="status"><span class="dot" id="dot"></span><span id="net"></span></div>
    <div class="rates" id="rates"></div>
    <div class="meta" id="meta"></div>
    <button id="refresh">Actualizar tasas</button>
  </div>
</main>

<script>
(function(){
  var KEY = 'egp-converter-rates-v1';
  // Valores de respaldo aproximados: solo se usan si nunca hubo conexión.
  var FALLBACK = { usd: 0.0205, cop: 80, time: null, source: 'valores de ejemplo (sin conexión previa)' };

  var $ = function(id){ return document.getElementById(id); };
  var egp = $('egp'), usd = $('usd'), cop = $('cop');
  var rates = load() || FALLBACK;
  var lastEdited = 'egp';
  var busy = false, lastError = false;

  function load(){
    try { var r = JSON.parse(localStorage.getItem(KEY)); return (r && r.usd && r.cop) ? r : null; }
    catch(e){ return null; }
  }
  function save(r){ try { localStorage.setItem(KEY, JSON.stringify(r)); } catch(e){} }

  function parse(v){
    v = String(v).trim().replace(/\s/g,'');
    // Acepta "1.234,56" y "1,234.56"
    if (v.indexOf(',') > -1 && v.indexOf('.') > -1) {
      v = v.lastIndexOf(',') > v.lastIndexOf('.') ? v.replace(/\./g,'').replace(',', '.') : v.replace(/,/g,'');
    } else { v = v.replace(',', '.'); }
    var n = parseFloat(v); return isNaN(n) ? null : n;
  }
  function fmt(n, dec){ return n.toLocaleString('es-CO', {minimumFractionDigits: dec, maximumFractionDigits: dec}); }

  function recalc(){
    var base;
    if (lastEdited === 'egp') base = parse(egp.value);
    else if (lastEdited === 'usd') { var u = parse(usd.value); base = u === null ? null : u / rates.usd; }
    else { var c = parse(cop.value); base = c === null ? null : c / rates.cop; }
    if (base === null) {
      if (lastEdited !== 'egp') egp.value = '';
      if (lastEdited !== 'usd') usd.value = '';
      if (lastEdited !== 'cop') cop.value = '';
      return;
    }
    if (lastEdited !== 'egp') egp.value = fmt(base, 2);
    if (lastEdited !== 'usd') usd.value = fmt(base * rates.usd, 2);
    if (lastEdited !== 'cop') cop.value = fmt(base * rates.cop, 0);
  }

  function render(){
    $('rates').innerHTML =
      '1 EGP = ' + fmt(rates.usd, 4) + ' USD<br>' +
      '1 EGP = ' + fmt(rates.cop, 2) + ' COP<br>' +
      '1 USD = ' + fmt(1 / rates.usd, 2) + ' EGP';
    var online = navigator.onLine;
    $('dot').className = 'dot ' + (online ? 'on' : 'off');
    $('net').textContent = online ? 'Con conexión' : 'Sin conexión — usando las últimas tasas guardadas';
    $('meta').innerHTML = rates.time
      ? 'Tasas del ' + new Date(rates.time).toLocaleString('es-CO') + ' · ' + rates.source
      : '<span class="warn">Aún no hay tasas reales guardadas: ' + rates.source + '. Conéctate una vez para actualizarlas.</span>';
    $('refresh').disabled = !online || busy;
    renderStatus();
  }

  function ago(t){
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'hace un momento';
    if (m < 60) return 'hace ' + m + ' min';
    var h = Math.round(m / 60);
    if (h < 48) return 'hace ' + h + ' h';
    return 'hace ' + Math.round(h / 24) + ' días';
  }

  function renderStatus(){
    var has = !!rates.time;
    var b = $('badge');
    if (busy) {
      b.className = 'badge busy';
      b.innerHTML = '<span class="icon">⏳</span><div>Descargando tasas…' +
        (has ? '<small>Mientras tanto se usan las guardadas</small>' : '') + '</div>';
    } else if (has) {
      b.className = 'badge ok';
      b.innerHTML = '<span class="icon">✅</span><div>Tasas descargadas y guardadas' +
        '<small>' + new Date(rates.time).toLocaleString('es-CO') + ' (' + ago(rates.time) + ')' +
        (lastError ? ' · la última actualización falló, se usan estas' : '') + '</small></div>';
    } else {
      b.className = 'badge none';
      b.innerHTML = '<span class="icon">⚠️</span><div>Tasas NO descargadas' +
        '<small>' + (lastError ? 'No se pudo descargar. ' : '') +
        'Se usan valores de ejemplo; conéctate a internet para descargarlas.</small></div>';
    }
    var rows = [
      ['EGP → USD', rates.usd, 6],
      ['EGP → COP', rates.cop, 2],
      ['USD → EGP', 1 / rates.usd, 2],
      ['USD → COP', rates.cop / rates.usd, 2]
    ];
    $('rateTable').innerHTML = rows.map(function(r){
      return '<tr><td>' + r[0] + '</td><td class="' + (has ? 'y' : 'n') + '">' +
        (has ? '✔ Descargada' : '✖ Ejemplo') + '</td><td>' + fmt(r[1], r[2]) + '</td></tr>';
    }).join('');
  }

  function fetchJSON(url){
    return fetch(url, {cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); });
  }

  function update(){
    if (!navigator.onLine || busy) { render(); return; }
    busy = true; render();
    var btn = $('refresh'); btn.textContent = 'Actualizando…';
    fetchJSON('https://open.er-api.com/v6/latest/EGP')
      .then(function(d){
        if (d.result !== 'success') throw 0;
        return { usd: d.rates.USD, cop: d.rates.COP, source: 'open.er-api.com' };
      })
      .catch(function(){
        return fetchJSON('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/egp.json')
          .then(function(d){ return { usd: d.egp.usd, cop: d.egp.cop, source: 'fawazahmed0 currency-api' }; });
      })
      .then(function(r){
        if (!r.usd || !r.cop) throw 0;
        r.time = Date.now(); rates = r; save(r); lastError = false; recalc();
      })
      .catch(function(){ lastError = true; /* se mantienen las tasas guardadas */ })
      .then(function(){ busy = false; btn.textContent = 'Actualizar tasas'; render(); });
  }

  [['egp',egp],['usd',usd],['cop',cop]].forEach(function(p){
    p[1].addEventListener('input', function(){ lastEdited = p[0]; recalc(); });
  });
  $('refresh').addEventListener('click', update);
  window.addEventListener('online', update);
  window.addEventListener('offline', render);

  recalc(); render(); update();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
