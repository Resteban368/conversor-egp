<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversor EGP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conversor EGP">
<meta name="theme-color" content="#b8862b">
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a65;
    --line:#e3dfd5; --accent:#b8862b; --ok:#2f7d4f; --warn:#b4532a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#15140f; --card:#1f1d17; --ink:#f1ede3; --muted:#a39f93;
      --line:#34312a; --accent:#d9a648; --ok:#5cb37f; --warn:#e07b4f; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center;padding:24px 16px}
  main{width:100%;max-width:460px}
  h1{font-size:1.4rem;margin:0 0 4px}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px}
  label b{color:var(--ink);font-weight:600}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  input{width:100%;font-size:1.4rem;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);background:transparent;color:var(--ink);font-variant-numeric:tabular-nums}
  input:focus{outline:2px solid var(--accent);border-color:transparent}
  .status{display:flex;align-items:center;gap:8px;font-size:.85rem;margin-bottom:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--ok)} .dot.off{background:var(--warn)}
  .meta{font-size:.8rem;color:var(--muted)}
  button{margin-top:12px;width:100%;padding:11px;border-radius:10px;border:none;
    background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .badge{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;
    font-weight:600;margin-bottom:12px;border:1px solid var(--line)}
  .badge .icon{font-size:1.3rem;line-height:1}
  .badge small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;margin-top:2px}
  .badge.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:var(--ok)}
  .badge.none{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:var(--warn)}
  .badge.busy{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .chips span{font-size:.8rem;color:var(--muted);width:100%}
  .chip{margin:0;width:auto;padding:7px 12px;border-radius:999px;font-size:.9rem;font-weight:600;
    background:transparent;color:var(--ink);border:1px solid var(--line)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .rate{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums}
  .rate:last-child{border-bottom:none}
  .rate .code{grid-row:span 2;font-weight:700;font-size:1.05rem;align-self:center;min-width:3.2em}
  .rate .code small{display:block;font-weight:500;font-size:.72rem}
  .rate .l1{font-size:1rem;font-weight:600}
  .rate .l2{font-size:.88rem;color:var(--muted)}
  .y{color:var(--ok)} .n{color:var(--warn)}
</style>
</head>
<body>
<main>
  <h1>Conversor de libra egipcia</h1>
  <p class="sub">USD · COP · EUR · ALL. Escribe en cualquier casilla y las demás se calculan.</p>

  <div class="card">
    <div class="badge" id="badge"></div>
    <div class="chips" id="chips"></div>
    <div id="rateList"></div>
  </div>

  <div class="card" id="fields"></div>

  <div class="card">
    <div class="status"><span class="dot" id="dot"></span><span id="net"></span></div>
    <div class="meta" id="meta"></div>
    <button id="refresh">Actualizar tasas</button>
  </div>
</main>

<script>
(function(){
  // Monedas destino. Para agregar otra, basta con sumar una línea aquí.
  // ex = tasa de ejemplo (1 EGP = ex), solo se usa si nunca se descargó.
  var CURRENCIES = [
    { code:'USD', name:'Dólar estadounidense', dec:2, ex:0.0205 },
    { code:'COP', name:'Peso colombiano',      dec:0, ex:80 },
    { code:'EUR', name:'Euro',                 dec:2, ex:0.0177 },
    { code:'ALL', name:'Lek albanés',          dec:0, ex:1.70 }
  ];
  var KEY = 'egp-converter-rates-v2', OLD_KEY = 'egp-converter-rates-v1';

  var $ = function(id){ return document.getElementById(id); };
  var busy = false, lastError = false, lastEdited = 'EGP';
  var baseCode = 'EGP';
  try { baseCode = localStorage.getItem('egp-converter-base') || 'EGP'; } catch(e){}

  // Campos de entrada
  var fieldsHtml = '<div class="field"><label for="in-EGP"><b>EGP</b><span>Libra egipcia</span></label>' +
    '<input id="in-EGP" inputmode="decimal" value="100"></div>';
  CURRENCIES.forEach(function(c){
    fieldsHtml += '<div class="field"><label for="in-' + c.code + '"><b>' + c.code + '</b><span>' + c.name +
      '</span></label><input id="in-' + c.code + '" inputmode="decimal"></div>';
  });
  $('fields').innerHTML = fieldsHtml;

  // rates = { time, source, r: { USD: n, ... } } ; una moneda sin valor real usa el ejemplo
  function load(){
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.r) return s;
      var o = JSON.parse(localStorage.getItem(OLD_KEY)); // versión anterior: solo USD y COP
      if (o && o.usd && o.cop) return { time:o.time, source:o.source, r:{ USD:o.usd, COP:o.cop } };
    } catch(e){}
    return { time:null, source:null, r:{} };
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(rates)); } catch(e){} }
  var rates = load();

  function rate(c){ return rates.r[c.code] || c.ex; }
  function real(c){ return !!(rates.time && rates.r[c.code]); }

  function parse(v){
    v = String(v).trim().replace(/\s/g,'');
    if (v.indexOf(',') > -1 && v.indexOf('.') > -1) {
      v = v.lastIndexOf(',') > v.lastIndexOf('.') ? v.replace(/\./g,'').replace(',', '.') : v.replace(/,/g,'');
    } else if ((v.match(/\./g) || []).length > 1) { v = v.replace(/\./g,''); }
    else { v = v.replace(',', '.'); }
    var n = parseFloat(v); return isNaN(n) ? null : n;
  }
  function fmt(n, dec){ return n.toLocaleString('es-CO', {minimumFractionDigits: dec, maximumFractionDigits: dec}); }
  function smart(n){ return fmt(n, n >= 100 ? 2 : n >= 0.01 ? 4 : 6); }

  function recalc(){
    var v = parse($('in-' + lastEdited).value), base = null;
    if (v !== null) {
      if (lastEdited === 'EGP') base = v;
      else { var c = CURRENCIES.filter(function(x){ return x.code === lastEdited; })[0]; base = v / rate(c); }
    }
    if (lastEdited !== 'EGP') $('in-EGP').value = base === null ? '' : fmt(base, 2);
    CURRENCIES.forEach(function(c){
      if (c.code !== lastEdited) $('in-' + c.code).value = base === null ? '' : fmt(base * rate(c), c.dec);
    });
  }

  function ago(t){
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'hace un momento';
    if (m < 60) return 'hace ' + m + ' min';
    var h = Math.round(m / 60);
    if (h < 48) return 'hace ' + h + ' h';
    return 'hace ' + Math.round(h / 24) + ' días';
  }

  function render(){
    var online = navigator.onLine;
    $('dot').className = 'dot ' + (online ? 'on' : 'off');
    $('net').textContent = online ? 'Con conexión' : 'Sin conexión: se usan las últimas tasas guardadas';
    $('meta').textContent = rates.time ? 'Fuente: ' + rates.source : 'Aún no hay tasas descargadas.';
    $('refresh').disabled = !online || busy;

    var nReal = CURRENCIES.filter(real).length, all = nReal === CURRENCIES.length;
    var b = $('badge');
    if (busy) {
      b.className = 'badge busy';
      b.innerHTML = '<span class="icon">⏳</span><div>Descargando tasas…' +
        (rates.time ? '<small>Mientras tanto se usan las guardadas</small>' : '') + '</div>';
    } else if (all) {
      b.className = 'badge ok';
      b.innerHTML = '<span class="icon">✅</span><div>Tasas descargadas y guardadas' +
        '<small>' + new Date(rates.time).toLocaleString('es-CO') + ' (' + ago(rates.time) + ')' +
        (lastError ? ' · la última actualización falló, se usan estas' : '') + '</small></div>';
    } else if (nReal > 0) {
      b.className = 'badge none';
      b.innerHTML = '<span class="icon">⚠️</span><div>Faltan tasas por descargar' +
        '<small>Las marcadas como "Ejemplo" no son reales. Abre la app con internet para completarlas.</small></div>';
    } else {
      b.className = 'badge none';
      b.innerHTML = '<span class="icon">⚠️</span><div>Tasas NO descargadas' +
        '<small>' + (lastError ? 'No se pudo descargar. ' : '') +
        'Se usan valores de ejemplo; conéctate a internet para descargarlas.</small></div>';
    }

    var ALLC = [{ code:'EGP' }].concat(CURRENCIES);
    function rel(c){ return c.code === 'EGP' ? 1 : rate(c); }      // valor de 1 EGP en c
    function isReal(c){ return c.code === 'EGP' || real(c); }
    var base = ALLC.filter(function(c){ return c.code === baseCode; })[0] || ALLC[0];
    $('chips').innerHTML = '<span>Ver el cambio de:</span>' + ALLC.map(function(c){
      return '<button class="chip" data-code="' + c.code + '" aria-pressed="' + (c.code === base.code) + '">' + c.code + '</button>';
    }).join('');
    $('rateList').innerHTML = ALLC.filter(function(c){ return c.code !== base.code; }).map(function(c){
      var r = rel(c) / rel(base), ok = isReal(c) && isReal(base);
      return '<div class="rate"><div class="code">' + c.code + '<small class="' + (ok ? 'y' : 'n') + '">' +
        (ok ? '✔ real' : '✖ ejemplo') + '</small></div>' +
        '<div class="l1">1 ' + base.code + ' = ' + smart(r) + ' ' + c.code + '</div>' +
        '<div class="l2">1 ' + c.code + ' = ' + smart(1 / r) + ' ' + base.code + '</div></div>';
    }).join('');
  }

  function fetchJSON(url){
    return fetch(url, {cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); });
  }
  function pick(src, lower){
    var out = {}, n = 0;
    CURRENCIES.forEach(function(c){
      var v = src[lower ? c.code.toLowerCase() : c.code];
      if (typeof v === 'number' && v > 0) { out[c.code] = v; n++; }
    });
    if (n !== CURRENCIES.length) throw 0;
    return out;
  }

  function update(){
    if (!navigator.onLine || busy) { render(); return; }
    busy = true; render();
    var btn = $('refresh'); btn.textContent = 'Actualizando…';
    fetchJSON('https://open.er-api.com/v6/latest/EGP')
      .then(function(d){
        if (d.result !== 'success') throw 0;
        return { r: pick(d.rates, false), source: 'open.er-api.com' };
      })
      .catch(function(){
        return fetchJSON('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/egp.json')
          .then(function(d){ return { r: pick(d.egp, true), source: 'fawazahmed0 currency-api' }; });
      })
      .then(function(res){
        rates = { time: Date.now(), source: res.source, r: res.r };
        save(); lastError = false; recalc();
      })
      .catch(function(){ lastError = true; })
      .then(function(){ busy = false; btn.textContent = 'Actualizar tasas'; render(); });
  }

  ['EGP'].concat(CURRENCIES.map(function(c){ return c.code; })).forEach(function(code){
    $('in-' + code).addEventListener('input', function(){ lastEdited = code; recalc(); });
  });
  $('chips').addEventListener('click', function(e){
    var code = e.target.getAttribute && e.target.getAttribute('data-code');
    if (!code) return;
    baseCode = code;
    try { localStorage.setItem('egp-converter-base', code); } catch(err){}
    render();
  });
  $('refresh').addEventListener('click', update);
  window.addEventListener('online', update);
  window.addEventListener('offline', render);

  recalc(); render(); update();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
